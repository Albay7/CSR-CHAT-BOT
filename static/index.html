<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSR Agent | AI Customer Service Representative</title>
  <meta name="description" content="AI-powered Customer Service Representative assistant. Get instant, verified resolutions for billing, returns, account access, technical troubleshooting, and customer inquiries." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Tokens ────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:        #0b2341;
      --navy-mid:    #13305a;
      --navy-light:  #1a3f72;
      --blue:        #0072cf;
      --blue-light:  #3b9ede;
      --gold:        #c8a951;
      --gold-light:  #e0c97a;
      --surface:     #0f1e35;
      --surface-2:   #162843;
      --surface-3:   #1d3354;
      --border:      rgba(255,255,255,0.08);
      --text:        #e8edf5;
      --text-muted:  #8fa3bc;
      --radius:      14px;
      --radius-sm:   8px;
      --shadow:      0 8px 32px rgba(0,0,0,0.4);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--surface);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Layout ────────────────────────────────────────────────────────── */
    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ───────────────────────────────────────────────────────── */
    .sidebar {
      width: 280px;
      min-width: 280px;
      background: linear-gradient(180deg, var(--navy) 0%, var(--navy-mid) 100%);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
      overflow-y: auto;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .logo-text h1 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .logo-text p {
      font-size: 11px;
      color: var(--gold);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .sidebar-divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }

    .sidebar-section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    /* Status badge */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin-bottom: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      flex-shrink: 0;
    }

    .status-dot.loading { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }

    .status-text { font-size: 12px; color: var(--text-muted); }
    .status-text strong { color: var(--text); display: block; font-size: 13px; }

    /* Suggested questions */
    .question-btn {
      width: 100%;
      text-align: left;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      color: var(--text-muted);
      font-size: 12.5px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-bottom: 6px;
      line-height: 1.4;
      transition: all 0.2s ease;
    }

    .question-btn:hover {
      background: rgba(0, 114, 207, 0.15);
      border-color: rgba(0, 114, 207, 0.4);
      color: var(--text);
      transform: translateX(2px);
    }

    .clear-btn {
      margin-top: auto;
      width: 100%;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      color: #f87171;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .clear-btn:hover { background: rgba(239,68,68,0.2); }

    /* ── Main Chat Area ─────────────────────────────────────────────────── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
    }

    /* Header */
    .chat-header {
      background: linear-gradient(90deg, var(--navy) 0%, var(--navy-mid) 100%);
      border-bottom: 1px solid var(--border);
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .chat-header-title { font-size: 17px; font-weight: 600; }
    .chat-header-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .header-badge {
      background: rgba(200,169,81,0.15);
      border: 1px solid rgba(200,169,81,0.3);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      color: var(--gold);
      font-weight: 600;
    }

    /* Messages container */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 10px; }

    /* Message bubbles */
    .msg {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      animation: fadeSlideIn 0.3s ease;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .msg.assistant .msg-avatar {
      background: linear-gradient(135deg, var(--navy-light), var(--blue));
    }

    .msg.user .msg-avatar {
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
    }

    .msg-body { max-width: 72%; display: flex; flex-direction: column; gap: 6px; }
    .msg.user .msg-body { align-items: flex-end; }

    .msg-bubble {
      padding: 14px 18px;
      border-radius: var(--radius);
      line-height: 1.65;
      font-size: 14.5px;
    }

    .msg.assistant .msg-bubble {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
    }

    .msg.user .msg-bubble {
      background: linear-gradient(135deg, var(--blue), var(--blue-light));
      border-top-right-radius: 4px;
      color: #fff;
    }

    /* Sources */
    .msg-sources {
      background: rgba(0,114,207,0.07);
      border: 1px solid rgba(0,114,207,0.2);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .sources-toggle {
      width: 100%;
      background: none;
      border: none;
      padding: 9px 13px;
      color: var(--blue-light);
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .sources-toggle:hover { background: rgba(0,114,207,0.1); }

    .sources-list { display: none; padding: 0 13px 10px; }
    .sources-list.open { display: block; }

    .source-item {
      font-size: 12px;
      color: var(--text-muted);
      padding: 5px 0;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .source-item a {
      color: var(--blue-light);
      text-decoration: none;
      word-break: break-all;
    }

    .source-item a:hover { text-decoration: underline; }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .typing-dots {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-top-left-radius: 4px;
      padding: 14px 18px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: var(--blue-light);
      border-radius: 50%;
      animation: bounce 1.3s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
      40% { transform: translateY(-7px); opacity: 1; }
    }

    /* ── Input Bar ──────────────────────────────────────────────────────── */
    .input-bar {
      background: var(--surface-2);
      border-top: 1px solid var(--border);
      padding: 18px 28px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .input-wrap {
      flex: 1;
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: flex-end;
      padding: 4px 4px 4px 16px;
      transition: border-color 0.2s;
    }

    .input-wrap:focus-within { border-color: var(--blue); }

    #user-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14.5px;
      padding: 10px 0;
      resize: none;
      max-height: 130px;
      line-height: 1.5;
    }

    #user-input::placeholder { color: var(--text-muted); }

    #send-btn {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--blue), var(--blue-light));
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.15s;
      margin: 4px;
    }

    #send-btn:hover { opacity: 0.88; transform: scale(1.05); }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    #send-btn svg { width: 18px; height: 18px; fill: #fff; }

    .input-hint {
      font-size: 11px;
      color: var(--text-muted);
      padding-top: 6px;
      text-align: center;
    }

    /* ── Responsive ────────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .chat-header-sub { display: none; }
      .messages { padding: 16px; }
      .input-bar { padding: 12px 16px; }
      .msg-body { max-width: 90%; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🎧</div>
      <div class="logo-text">
        <h1>CSR Agent</h1>
        <p>Customer Support AI</p>
      </div>
    </div>

    <div class="sidebar-divider"></div>

    <p class="sidebar-section-title">System Status</p>
    <div class="status-badge" id="status-badge">
      <div class="status-dot loading" id="status-dot"></div>
      <div class="status-text">
        <strong id="status-label">Initialising…</strong>
        <span id="status-sub">Connecting to RAG engine</span>
      </div>
    </div>

    <div class="sidebar-divider"></div>

    <p class="sidebar-section-title">Suggested Inquiries</p>
    <button class="question-btn" onclick="askSuggestion(this)">How do I request a return or exchange for my order?</button>
    <button class="question-btn" onclick="askSuggestion(this)">I am experiencing an account lockout or login issue.</button>
    <button class="question-btn" onclick="askSuggestion(this)">Why was my card charged twice for a subscription?</button>
    <button class="question-btn" onclick="askSuggestion(this)">How do I update my billing info or payment method?</button>
    <button class="question-btn" onclick="askSuggestion(this)">What is the status of ongoing system service outages?</button>
    <button class="question-btn" onclick="askSuggestion(this)">How can I escalate my ticket to a human specialist?</button>

    <div class="sidebar-divider"></div>

    <button class="clear-btn" onclick="clearChat()">🗑 Clear Conversation</button>
  </aside>

  <!-- Main Chat -->
  <main class="chat-area">
    <header class="chat-header">
      <div>
        <div class="chat-header-title">🎧 CSR Agent · Customer Support</div>
        <div class="chat-header-sub">Powered by Google Gemini · Grounded Support Ticket Retrieval</div>
      </div>
      <div class="header-badge">Live Support</div>
    </header>

    <div class="messages" id="messages"></div>

    <div class="input-bar">
      <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
        <div class="input-wrap">
          <textarea
            id="user-input"
            rows="1"
            placeholder="Describe your issue or ask about billing, returns, technical support, account access…"
          ></textarea>
          <button id="send-btn" onclick="sendMessage()" title="Send">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
        <div class="input-hint">Press Enter to send · Shift+Enter for new line</div>
      </div>
    </div>
  </main>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let history = [];
  let isLoading = false;

  // ── DOM refs ───────────────────────────────────────────────────────────────
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');

  // ── Helpers ────────────────────────────────────────────────────────────────
  function scrollToBottom() {
    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  // Minimal markdown renderer (bold, italic, bullet lists, inline code)
  function renderMarkdown(text) {
    return text
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/`(.+?)`/g, '<code style="background:rgba(255,255,255,0.1);padding:1px 5px;border-radius:4px;font-size:13px">$1</code>')
      .replace(/^#{1,3} (.+)$/gm, '<strong style="font-size:15px;display:block;margin:6px 0 2px">$1</strong>')
      .replace(/^[-•] (.+)$/gm, '<li style="margin-left:16px;margin-bottom:4px">$1</li>')
      .replace(/\n/g, '<br>');
  }

  function buildSourcesHtml(sources) {
    if (!sources || sources.length === 0) return '';
    const id = 'src-' + Date.now();
    const items = sources.map(s =>
      `<div class="source-item">📌 <span><strong>${escapeHtml(s.title)}</strong> (${escapeHtml(s.category)})<br>
       <a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.url)}</a></span></div>`
    ).join('');
    return `<div class="msg-sources">
      <button class="sources-toggle" onclick="toggleSources('${id}')">
        📚 ${sources.length} Verified Source${sources.length>1?'s':''} <span id="arr-${id}">▶</span>
      </button>
      <div class="sources-list" id="${id}">${items}</div>
    </div>`;
  }

  function toggleSources(id) {
    const el  = document.getElementById(id);
    const arr = document.getElementById('arr-' + id);
    el.classList.toggle('open');
    arr.textContent = el.classList.contains('open') ? '▼' : '▶';
  }

  function appendMessage(role, content, sources=[]) {
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;

    const avatar = role === 'assistant' ? '🎓' : '👤';
    const bubble = renderMarkdown(role === 'user' ? escapeHtml(content) : content);
    const srcs   = buildSourcesHtml(sources);

    wrap.innerHTML = `
      <div class="msg-avatar">${avatar}</div>
      <div class="msg-body">
        <div class="msg-bubble">${bubble}</div>
        ${srcs}
      </div>`;
    messagesEl.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function showTyping() {
    const el = document.createElement('div');
    el.className = 'typing-indicator';
    el.id = 'typing';
    el.innerHTML = `
      <div class="msg-avatar" style="background:linear-gradient(135deg,#13305a,#0072cf)">🎓</div>
      <div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    messagesEl.appendChild(el);
    scrollToBottom();
  }

  function hideTyping() {
    document.getElementById('typing')?.remove();
  }

  function setLoading(val) {
    isLoading    = val;
    sendBtn.disabled = val;
    inputEl.disabled = val;
  }

  // ── Status check ───────────────────────────────────────────────────────────
  async function checkStatus() {
    try {
      const r = await fetch('/health');
      const d = await r.json();
      const dot   = document.getElementById('status-dot');
      const label = document.getElementById('status-label');
      const sub   = document.getElementById('status-sub');
      if (d.engine_ready) {
        dot.classList.remove('loading');
        if (d.is_online) {
          dot.style.background = '#10b981';
          dot.style.boxShadow = '0 0 10px rgba(16, 185, 129, 0.4)';
          label.textContent = 'Online & Ready';
          sub.textContent   = (d.provider === 'gemini' ? 'Gemini AI active' : (d.provider || 'AI') + ' active');
        } else {
          dot.style.background = '#f59e0b';
          dot.style.boxShadow = '0 0 10px rgba(245, 158, 11, 0.4)';
          label.textContent = 'Offline Demo Mode';
          sub.textContent   = 'No API key in .env';
        }
      } else {
        label.textContent = 'Warming up…';
        sub.textContent   = 'Loading knowledge base';
        setTimeout(checkStatus, 3000);
      }
    } catch {
      setTimeout(checkStatus, 4000);
    }
  }

  // ── Send ───────────────────────────────────────────────────────────────────
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isLoading) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';

    appendMessage('user', text);
    history.push({ role: 'user', content: text });

    setLoading(true);
    showTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: history.slice(-6), top_k: 3 }),
      });

      if (!res.ok) throw new Error(`Server error ${res.status}`);
      const data = await res.json();

      hideTyping();
      appendMessage('assistant', data.answer, data.sources);
      history.push({ role: 'assistant', content: data.answer });
    } catch (err) {
      hideTyping();
      appendMessage('assistant', `⚠️ **Error**: ${err.message}. Please try again.`);
    } finally {
      setLoading(false);
      inputEl.focus();
    }
  }

  function askSuggestion(btn) {
    inputEl.value = btn.textContent.trim();
    inputEl.dispatchEvent(new Event('input'));
    sendMessage();
  }

  function clearChat() {
    history = [];
    messagesEl.innerHTML = '';
    addWelcomeMessage();
  }

  function addWelcomeMessage() {
    appendMessage('assistant',
      `👋 **Hello! I am your CSR Agent.**\n\nI am here to assist you with any customer support inquiries, including:\n- 💳 **Billing & Payment Discrepancies**\n- 📦 **Returns, Refunds & Order Exchanges**\n- 🔑 **Account Access & Password Recovery**\n- 🛠️ **Technical Support & Troubleshooting**\n- ⚡ **Service Outages & Maintenance Alerts**\n- 🙋 **General Customer Care & Ticket Escalation**\n\nHow can I help you today?`
    );
  }

  // ── Auto-resize textarea ───────────────────────────────────────────────────
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + 'px';
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ── Init ───────────────────────────────────────────────────────────────────
  addWelcomeMessage();
  checkStatus();
</script>
</body>
</html>
